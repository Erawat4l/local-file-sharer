name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  test:
    name: verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      - run: pytest -q

  dist:
    name: sdist + wheel
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: verify the version matches the tag
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          print("pyproject:", version, "tag:", tag)
          assert version == tag, "pyproject version does not match the pushed tag"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  windows-exe:
    name: standalone start.exe (Windows)
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pyinstaller
      - run: pip install .
      - name: build one-file exe
        run: >
          pyinstaller --noconfirm --clean --onefile --name local-file-sharer
          --collect-data local_file_sharer
          --hidden-import qrcode.image.svg
          --console "src/local_file_sharer/__main__.py"
      - name: smoke test
        run: dist\local-file-sharer.exe version
      - name: checksums
        shell: pwsh
        run: |
          Get-FileHash dist/local-file-sharer.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  local-file-sharer-windows-x64.exe" } |
            Set-Content dist/SHA256SUMS.txt
          Rename-Item dist/local-file-sharer.exe local-file-sharer-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/local-file-sharer-windows-x64.exe
            dist/SHA256SUMS.txt

  publish:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [dist, windows-exe]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: collect assets
        run: |
          mkdir -p release
          cp artifacts/dist/* release/
          cp artifacts/windows-exe/* release/
          ls -lh release
      - name: extract the changelog section
        run: |
          python - <<'PY'
          import os, re, pathlib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text()
          pattern = rf"## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, text, re.S)
          body = match.group(1).strip() if match else f"Release {tag}"
          pathlib.Path("release-notes.md").write_text(body + "\n")
          print(body[:400])
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    name: publish to PyPI (optional)
    runs-on: ubuntu-latest
    needs: [publish]
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
