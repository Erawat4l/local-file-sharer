name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff>=0.3"
      - name: ruff check
        run: ruff check src tests --output-format=github
      - name: ruff format
        run: ruff format --check --diff src tests
      - name: oldest supported Python (3.9) compatibility
        run: python tools/check_compat.py

  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: pytest
        run: pytest -q --cov=local_file_sharer --cov-report=xml --cov-report=term-missing
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: build · sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: check the wheel installs and the entry point works
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/start version
          /tmp/check/bin/start --help > /dev/null
          /tmp/check/bin/start completions fish > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  install-scripts:
    name: install scripts · syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: bash -n install.sh
      - name: install.sh --help
        run: bash install.sh --help | head -20
      - name: fish structural check (no fish needed)
        run: python tools/check_fish.py
      - name: README images resolve
        run: |
          pip install ".[shots]"
          python tools/screenshots/check_assets.py
      - name: fish functions parse
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish
          fish --no-execute shell/fish/start.fish
          fish --no-execute shell/windows/start.fish
          for shell in fish bash powershell zsh; do
            PYTHONPATH=src python -m local_file_sharer completions "$shell" > /dev/null
          done
          PYTHONPATH=src python -m local_file_sharer completions fish > /tmp/start.fish
          fish --no-execute /tmp/start.fish
      - name: powershell parse
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
          Get-Help ./install.ps1 -ErrorAction SilentlyContinue | Out-Null
