name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff>=0.3"
      - name: ruff check
        run: ruff check src tests --output-format=github
      - name: ruff format
        run: ruff format --check --diff src tests
      - name: oldest supported Python (3.9) compatibility
        run: python tools/check_compat.py

  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: pytest
        shell: bash
        # tee keeps the output for the summary; PIPESTATUS keeps pytest's status,
        # which a plain pipe would replace with tee's (always 0).
        run: |
          set -o pipefail
          pytest -q --tb=line -rf --cov=local_file_sharer --cov-report=xml --cov-report=term-missing | tee pytest-output.txt
      # When this fails, the failing test names go into the job summary and an
      # annotation. Without it the only copy is in the log blob, which is not
      # always reachable -- and a red matrix you cannot read is a red matrix
      # nobody fixes. Runs even when pytest fails, and never masks its status.
      # Annotations are the only part of a run that can be read back from here:
      # the log blob and the artifacts both live on a host this sandbox cannot
      # reach, and .output.summary is not exposed. So the reason for every
      # failure goes into its own annotation, one line each -- pytest -q
      # --tb=line -rf puts exactly that on the FAILED line, and a multi-line
      # message would be truncated at the first newline anyway.
      - name: failure summary
        if: failure()
        shell: bash
        run: |
          if [ ! -f pytest-output.txt ]; then
            echo "::error::pytest did not produce any output (install or collection error)"
            exit 0
          fi
          echo "### failing tests" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '^FAILED ' pytest-output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python tools/report_failures.py pytest-output.txt || true
      - name: upload failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failures-${{ matrix.os }}-py${{ matrix.python }}
          path: pytest-output.txt
          if-no-files-found: ignore

      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: build · sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: check the wheel installs and the entry point works
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          # the console script is `lfs` (and `local-file-sharer`); `start` was
          # the old name and no longer exists as an entry point
          /tmp/check/bin/lfs version
          /tmp/check/bin/lfs --help > /dev/null
          /tmp/check/bin/lfs completions fish > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  install-scripts:
    name: install scripts · syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: bash -n install.sh
      - name: install.sh --help
        run: bash install.sh --help | head -20
      - name: fish structural check (no fish needed)
        run: python tools/check_fish.py
      - name: README images resolve
        run: |
          pip install ".[shots]"
          python tools/screenshots/check_assets.py
      - name: fish functions parse
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish
          fish --no-execute shell/fish/lfs.fish
          fish --no-execute shell/windows/lfs.fish
          for shell in fish bash powershell zsh; do
            PYTHONPATH=src python -m local_file_sharer completions "$shell" > /dev/null
          done
          PYTHONPATH=src python -m local_file_sharer completions fish > /tmp/lfs.fish
          fish --no-execute /tmp/lfs.fish
      - name: powershell parse
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
          Get-Help ./install.ps1 -ErrorAction SilentlyContinue | Out-Null
