name: Bug report
description: Something crashed, hung, or did not do what it promised.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! The two things that let us fix a bug fastest are
        **exactly how to reproduce it** and the **diagnostics output**.

        Please do not paste secrets (PINs you still use, tokens, public IPs you
        would rather keep private).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The actual behaviour, including any error message or panel text.
      placeholder: |
        `start --mode torrent ~/Photos` printed "share ready" and then exited with
        exit code 1 after ~5 seconds.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: The share should stay up until I press `q`.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `cd ~/Photos`
        2. `start --mode torrent .`
        3. Open the LAN link on my phone
        4. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `start version`.
      placeholder: local-file-sharer 1.0.0 / python 3.11.9 · linux
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Platform
      options:
        - Termux (Android)
        - Linux
        - macOS
        - Windows 10/11
        - WSL
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: `start doctor --json`
      description: Paste the JSON (it contains no secrets).
      render: json
    validations:
      required: false

  - type: textarea
    id: traceback
    attributes:
      label: Debug traceback
      description: Re-run with `--debug` and paste the traceback, if there is one.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed PINs, tokens and anything else I would not post publicly.
          required: true
